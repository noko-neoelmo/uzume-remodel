{{ADDITIONAL_SCHEMA}}
<style>
:root {
  --navy: #1B2A4A;
  --charcoal: #111111;
  --silver: #C0C5C9;
  --off-white: #FAFAF8;
  --text-body: #3D4A5C;
  --gold: #B8A88A;
  --border: #E8E6E3;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--navy);
  background: var(--off-white);
  line-height: 2;
}
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; }
img { display: block; max-width: 100%; }

/* Header */
.article-header {
  padding: 24px 0;
  border-bottom: 1px solid var(--border);
  background: #fff;
}
.article-header-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.article-header .logo {
  font-family: "Noto Serif JP", serif;
  font-size: 1.25rem;
  font-weight: 300;
  color: var(--navy);
  text-decoration: none;
  letter-spacing: 0.1em;
}
.article-header .back-link {
  font-size: 0.85rem;
  color: var(--text-body);
}

/* Breadcrumb */
.breadcrumb {
  max-width: 800px;
  margin: 16px auto 0;
  padding: 0 24px;
  font-size: 0.8rem;
  color: var(--silver);
}
.breadcrumb a { color: var(--text-body); }
.breadcrumb span { margin: 0 8px; }

/* Article */
.article {
  max-width: 800px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}
.article h1 {
  font-family: "Noto Serif JP", serif;
  font-size: 1.75rem;
  font-weight: 400;
  line-height: 1.6;
  margin-bottom: 16px;
  color: var(--charcoal);
}
.article-meta {
  font-size: 0.85rem;
  color: var(--silver);
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

/* Summary box - AI引用ターゲット */
.article-summary {
  background: #F5F4F1;
  border-left: 3px solid var(--gold);
  padding: 24px 28px;
  margin-bottom: 40px;
  font-size: 1rem;
  line-height: 1.9;
}

.article h2 {
  font-family: "Noto Serif JP", serif;
  font-size: 1.35rem;
  font-weight: 400;
  margin: 48px 0 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--charcoal);
}
.article h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 32px 0 12px;
  color: var(--navy);
}
.article p {
  margin-bottom: 20px;
  color: var(--text-body);
  font-size: 0.95rem;
}
.article ul, .article ol {
  margin: 0 0 20px 24px;
  color: var(--text-body);
  font-size: 0.95rem;
}
.article li { margin-bottom: 8px; }
.article table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 0.9rem;
}
.article th, .article td {
  padding: 12px 16px;
  border: 1px solid var(--border);
  text-align: left;
}
.article th {
  background: #F5F4F1;
  font-weight: 600;
  color: var(--navy);
}
.article td { color: var(--text-body); }

/* CTA */
.article-cta {
  background: var(--navy);
  color: #fff;
  padding: 40px 32px;
  border-radius: 8px;
  text-align: center;
  margin: 48px 0;
}
.article-cta h3 {
  color: #fff;
  font-family: "Noto Serif JP", serif;
  font-weight: 300;
  font-size: 1.2rem;
  margin-bottom: 16px;
}
.article-cta p {
  color: rgba(255,255,255,.7);
  font-size: 0.9rem;
  margin-bottom: 24px;
}
.article-cta a {
  display: inline-block;
  background: var(--gold);
  color: #fff;
  padding: 14px 40px;
  border-radius: 4px;
  font-size: 0.95rem;
  text-decoration: none;
  transition: opacity 0.3s;
}
.article-cta a:hover { opacity: 0.85; text-decoration: none; }

/* Related articles */
.related-articles {
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
}
.related-articles h3 {
  font-family: "Noto Serif JP", serif;
  font-weight: 300;
  margin-bottom: 20px;
}
.related-articles ul { list-style: none; margin-left: 0; }
.related-articles li {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.related-articles a { color: var(--navy); font-size: 0.95rem; }

/* Footer */
.article-footer {
  max-width: 800px;
  margin: 0 auto;
  padding: 32px 24px;
  text-align: center;
  font-size: 0.8rem;
  color: var(--silver);
  border-top: 1px solid var(--border);
}

@media (max-width: 600px) {
  .article h1 { font-size: 1.4rem; }
  .article h2 { font-size: 1.15rem; }
  .article { padding: 32px 16px 60px; }
  .article-summary { padding: 20px; }
}
</style>
</head>

  <div class="article-header-inner">
    <a href="https://uzume-remodel.vercel.app" class="logo">UZUME</a>
    <a href="https://uzume-remodel.vercel.app/articles/" class="back-link">コラム一覧へ</a>
  </div>
</header>

<nav class="breadcrumb">
  <a href="https://uzume-remodel.vercel.app">UZUME</a>
  <span>›</span>

  {{TITLE}}

<article class="article">

  <div class="article-cta">

  <div class="related-articles">

    <ul>

    </ul>
  </div>
</article>

<footer class="article-footer">
  &copy; 2026 UZUME / 株式会社BiSPOKE
</footer>

</body>
</html>
